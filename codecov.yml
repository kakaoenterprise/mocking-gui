# https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    # Coverage is still low; report without failing checks until the core engine is covered.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: 'condensed_header, diff, files'
  behavior: default
  require_changes: false

ignore:
  - 'examples/**'
  - 'docs/**'
  - 'packages/mocking-gui/src/components/ui/**'
