name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint (tsc + eslint)
        run: pnpm lint
      - name: Format check
        run: pnpm format:check

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Catches commits made with --no-verify or without the husky hooks installed.
      - name: commitlint (PR commits)
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # Squash merges use the PR title as the commit subject, so it must follow the same convention.
      - name: commitlint (PR title)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint --verbose

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Test with coverage
        run: pnpm --filter @kakaocloud/mocking-gui test:coverage
      # Codecov posts the PR comment and status checks, including for fork PRs.
      # Public repos upload tokenless (verified for fork PRs and main pushes), so no secret is needed.
      # If Codecov ever requires a token again, add CODECOV_TOKEN and pass `token:` here.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: packages/mocking-gui/coverage/coverage-final.json
          flags: mocking-gui
          # A Codecov outage must not block contributors; the missing codecov status check is visible anyway.
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/mocking-gui/coverage
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build all packages
        run: pnpm build
      - name: Verify package contents
        working-directory: packages/mocking-gui
        run: |
          pnpm pack --pack-destination /tmp/pack
          tar -tzf /tmp/pack/*.tgz | sort
