version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ['*']
      radix-ui:
        patterns: ['@radix-ui/*']
      examples-next:
        patterns: ['next', 'eslint-config-next']
    ignore:
      # Peer dependencies: bump deliberately, not via bot.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: msw

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
