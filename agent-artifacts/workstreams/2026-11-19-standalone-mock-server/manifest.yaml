# the pull request that adds this folder.
current_phase: 3
status: awaiting_approval

decisions:
  - ADR-0009-standalone-mock-server

risks:
  - name: 'Browser bundles that use the scenario API now load the mock server code'
    severity: medium
    mitigation: 'No Node import in the module graph; entry layout for Node-only pre-release features is an open question in ADR-0009'
  - name: 'Unauthenticated control API'
    severity: medium
    mitigation: 'listen() binds 127.0.0.1 by default; documented as local development and test only'
  - name: 'Performance figures were taken before the code moved under ./experimental'
    severity: low
    mitigation: 'After the move the unit tests, the consumer typecheck and unit tests, and the E2E suite on both paths were run again (reports/integrity-validation.md)'
